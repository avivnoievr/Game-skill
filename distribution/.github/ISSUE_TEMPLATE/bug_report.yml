name: Bug report
description: Report a reproducible skill, installation or tool failure.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Version and source commit
      description: Copy the version and source_commit from RELEASE.json.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Claude local/cloud, operating system, engine and relevant Blender/Node versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Task and reproduction
      description: The prompt or smallest steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Relevant error, report, screenshot or minimal asset example.
    validations:
      required: true
